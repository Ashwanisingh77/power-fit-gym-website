<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact PowerFit Gym — reach out for membership inquiries, training programs, or any questions." />
  <title>Contact — PowerFit Gym</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- NAVBAR -->
  <nav id="navbar" class="navbar navbar--scrolled" role="navigation" aria-label="Main navigation">
    <div class="container navbar__inner">
      <a href="index.html" class="navbar__logo"><span class="accent">POWER</span><span>FIT</span></a>
      <ul class="navbar__links" style="display:flex">
        <li><a href="index.html" class="navbar__link">Home</a></li>
        <li><a href="about.html" class="navbar__link">About</a></li>
        <li><a href="services.html" class="navbar__link">Services</a></li>
        <li><a href="contact.html" class="navbar__link active">Contact</a></li>
      </ul>
      <button class="navbar__toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
      </button>
    </div>
    <div class="navbar__mobile" id="mobile-menu" aria-hidden="true">
      <ul class="navbar__mobile-links">
        <li><a href="index.html" class="navbar__mobile-link">Home</a></li>
        <li><a href="about.html" class="navbar__mobile-link">About</a></li>
        <li><a href="services.html" class="navbar__mobile-link">Services</a></li>
        <li><a href="contact.html" class="navbar__mobile-link active">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <section class="section-padding" style="padding-top:var(--sp-16);background:var(--color-bg);">
      <div class="container">
        <div class="section-header">
          <span class="section-header__tag">Get In Touch</span>
          <h1 class="section-header__title">Contact Us</h1>
        </div>

        <div class="contact__grid" style="max-width:900px;margin:0 auto;">
          <!-- Form -->
          <form class="contact__form glass-card" id="contact-form-page">
            <div class="form-group">
              <input type="text" name="name" id="pg-input-name" required placeholder=" " autocomplete="name" />
              <label for="pg-input-name">Your Name</label>
            </div>
            <div class="form-group">
              <input type="email" name="email" id="pg-input-email" required placeholder=" " autocomplete="email" />
              <label for="pg-input-email">Your Email</label>
            </div>
            <div class="form-group">
              <textarea name="message" id="pg-input-message" rows="5" required placeholder=" "></textarea>
              <label for="pg-input-message">Your Message</label>
            </div>
            <button type="submit" class="btn btn--primary btn--block" id="pg-contact-submit">
              <span class="btn__text">Send Message</span>
              <span class="btn__success" aria-hidden="true">✓ Message Sent!</span>
            </button>
          </form>

          <!-- Info -->
          <div class="contact__info">
            <h3>Let's <span class="accent">Connect</span></h3>
            <p class="text-secondary" style="margin-bottom:var(--sp-3);">
              Email: powerfit@gmail.com
            </p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__bottom">
      <div class="container footer__bottom-inner">
        <p class="text-muted text-xs">© 2026 PowerFit Gym. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script>
    /* Mobile nav */
    const t=document.getElementById('nav-toggle'),m=document.getElementById('mobile-menu');
    if(t&&m){t.addEventListener('click',()=>{const o=m.classList.toggle('open');t.classList.toggle('open');t.setAttribute('aria-expanded',o);m.setAttribute('aria-hidden',!o);});}

    /* Contact form */
    const f=document.getElementById('contact-form-page'),b=document.getElementById('pg-contact-submit');
    if(f&&b){f.addEventListener('submit',(e)=>{e.preventDefault();b.classList.add('btn--sent');f.reset();setTimeout(()=>b.classList.remove('btn--sent'),4000);});}
  </script>
  <script src="script.js"></script>
</body>

</html>
